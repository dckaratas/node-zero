tradeoff.log_level_info: "Kök nedeni bedavaya çözer; ama mürettebat zamanı harcar ve sonra hata ayıklama detayı kaybolur."
tradeoff.logrotate: "Disk kullanımını sınırlar; eski loglar lazım olduğunda yoktur."
tradeoff.expand_disk: "Çözüm değil, zaman kazandırır: ambar yine dolar, sadece daha geç."
tradeoff.vertical_scale_cpu: "Kapasiteyi bir anda ikiye katlar; ama 5 sn kesinti yaratır ve bir tavanı vardır."
tradeoff.nginx_rate_limit: "Fazlaya 429 dönerek reaktörü korur; o kullanıcılar yine de başarısız olur."
tradeoff.statement_timeout: "Bir sigorta: yavaş sorgular bağlantı tutmak yerine hızlıca başarısız olur."
tradeoff.create_index: "Kök nedeni çözer. Sorguyu bulmak için pg_stat_statements gerekir."
tradeoff.create_index_blocking: "Hızlı oluşur; ama çalışırken tabloya yazmayı kilitler."
tradeoff.create_index_concurrently: "Yazma kilidi yok; ama daha yavaş ve oluşurken veritabanı I/O'su ekler."
tradeoff.raise_max_threads: "Semptomu tedavi eder: daha fazla thread aynı 10 bağlantıyı bekler."
tradeoff.reschedule_job: "Bedava ve etkili; tabii kullanıcılarının ne zaman yoğun olduğunu biliyorsan."
tradeoff.batch_chunking: "Küçük ve yavaşlatılmış parçalar I/O'yu adil paylaşır; job daha uzun sürer."
tradeoff.bulkhead_pool: "Job kendi küçük havuzunu alır ve artık kullanıcıları aç bırakamaz."
tradeoff.naive_retry: "Backoff'suz tekrar deneme, zaten zorlanan veritabanının yükünü ikiye katlar."
tradeoff.prometheus: "Sisi kaldırır: CPU, thread, havuz ve disk için ham metrikler. Her dalga bakım maliyeti var."
tradeoff.postgres_exporter: "Veritabanı metrikleri ve pg_stat_statements: hangi sorgunun can yaktığını sonunda görürsün."
tradeoff.grafana: "Paneller metrikleri cevaba çevirir: gecikme, hata oranı, tahminler, trafik ısı haritası."
