tradeoff.log_level_info: "Fixes the cause for free, but costs crew time and hides debug detail later."
tradeoff.logrotate: "Keeps disk usage bounded; old logs are gone when you need them."
tradeoff.expand_disk: "Buys time, not a fix: the hold fills again, just later."
tradeoff.vertical_scale_cpu: "Doubles capacity at once, but costs a 5 s outage and has a ceiling."
tradeoff.nginx_rate_limit: "Protects the reactor by answering 429 to the excess; those users still fail."
tradeoff.statement_timeout: "A fuse: slow queries fail fast instead of holding connections."
tradeoff.create_index: "Fixes the root cause. Needs pg_stat_statements to find the query."
tradeoff.create_index_blocking: "Fast to build, but blocks writes on the table while it runs."
tradeoff.create_index_concurrently: "No write lock, but slower and adds database I/O while it builds."
tradeoff.raise_max_threads: "Treats the symptom: more threads now wait on the same 10 connections."
tradeoff.reschedule_job: "Free and effective, if you know when your users are busy."
tradeoff.batch_chunking: "Smaller, throttled chunks share I/O fairly; the job takes longer."
tradeoff.bulkhead_pool: "The job gets its own small pool and can no longer starve users."
tradeoff.naive_retry: "Retrying without backoff doubles the load on a database that is already struggling."
